name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=neon'
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=neon'
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate ytmdesktop2 pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=ytmdesktop2&theme=neon'
          path: profile/pin-ytmdesktop2.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate Biyori pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=Biyori&theme=neon'
          path: profile/pin-Biyori.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate Borderless pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=Borderless&theme=neon'
          path: profile/pin-Borderless.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Reject error cards
        run: |
          if grep -q "Something went wrong" profile/*.svg; then
            echo "Stats API refused the token. Add a PAT as the STATS_TOKEN secret."
            exit 1
          fi

      - name: Commit cards
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Update README cards
          file_pattern: profile/*.svg
